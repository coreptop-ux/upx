<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#02021a"/>
      <stop offset="100%" stop-color="#001a2e"/>
    </linearGradient>
    <radialGradient id="codGrad" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b0e0ff"/>
      <stop offset="100%" stop-color="#6aa3d9"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Stars -->
  <g fill="#ffffff" fill-opacity="0.9">
    <circle cx="80" cy="70" r="1.4"/>
    <circle cx="190" cy="120" r="1"/>
    <circle cx="320" cy="50" r="1.2"/>
    <circle cx="450" cy="90" r="1"/>
    <circle cx="620" cy="30" r="1.6"/>
    <circle cx="960" cy="80" r="1.1"/>
    <circle cx="1100" cy="180" r="1.5"/>
  </g>

  <!-- Cod body (stylized fish) -->
  <g transform="translate(300,350)" filter="url(#softShadow)">
    <path d="M-20 -90 C 120 -120, 320 -80, 360 -10 C 420 60, 330 120, 200 130 C 80 140, -20 100, -80 70 C -140 40, -170 -10, -160 -60 C -150 -100, -70 -110, -20 -90 Z"
          fill="url(#codGrad)" stroke="#2b6f9b" stroke-width="4"/>
    <!-- stripes (code-like) -->
    <g fill="#083b5b" opacity="0.95">
      <rect x="40" y="-30" width="120" height="8" rx="3" />
      <rect x="80" y="10" width="100" height="8" rx="3" />
      <rect x="140" y="-5" width="60" height="8" rx="3" />
    </g>
    <!-- eye -->
    <circle cx="170" cy="-20" r="14" fill="#ffffff"/>
    <circle cx="176" cy="-18" r="6" fill="#052235"/>
  </g>

  <!-- Helmet -->
  <g transform="translate(420,230)">
    <ellipse cx="0" cy="0" rx="110" ry="85" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="0" cy="6" rx="98" ry="74" fill="#eaf6ff"/>
    <rect x="-112" y="54" width="224" height="18" rx="9" fill="#d7eaf6"/>
    <circle cx="90" cy="-42" r="8" fill="#ffd27a"/>
  </g>

  <!-- Small code bracket icon near fish -->
  <g transform="translate(820,360)">
    <rect x="-70" y="-60" width="140" height="100" rx="10" fill="#0f2430" stroke="#9fc9e9" stroke-width="2"/>
    <text x="-40" y="-10" font-family="monospace" font-size="36" fill="#9fc9e9">{</text>
    <text x="10" y="34" font-family="monospace" font-size="36" fill="#9fc9e9">}</text>
  </g>

  <!-- Title -->
  <text x="72" y="110" font-family="'Segoe UI', Roboto, Arial" font-size="48" fill="#ffffff" font-weight="700">Space Cod — Upgraded</text>
  <text x="72" y="150" font-family="'Segoe UI', Roboto, Arial" font-size="20" fill="#bcdff6">Un bacalao espacial que depura bugs intergalácticos</text>

  <!-- Footer caption -->
  <text x="72" y="590" font-family="'Segoe UI', Roboto, Arial" font-size="14" fill="#9fbfe0">Diseño generado — listo para redes</text>

</svg>
